name: Build PSP ISO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Make ISO
        run: |
          (apk add --no-cache xorriso || (apt-get update && apt-get install -y xorriso))
          mksfoex -d MEMSIZE=1 -s DISC_ID=JJQE00001 -s DISC_VERSION=1.00 -s CATEGORY=UG "JayJay's Quest" PARAM.SFO
          mkdir -p iso/PSP_GAME/SYSDIR
          cp PARAM.SFO iso/PSP_GAME/PARAM.SFO
          cp JAYJAYQUEST.prx iso/PSP_GAME/SYSDIR/BOOT.BIN
          cp JAYJAYQUEST.prx iso/PSP_GAME/SYSDIR/EBOOT.BIN
          xorriso -as mkisofs -iso-level 4 -o JayJayQuest.iso iso
      - uses: actions/upload-artifact@v4
        with:
          name: JayJayQuest
          path: |
            JayJayQuest.iso
            EBOOT.PBP
