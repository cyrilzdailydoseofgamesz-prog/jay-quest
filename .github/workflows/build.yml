name: Build Ashfall PSP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build PSP EBOOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate 3D assets
        run: |
          python3 --version
          python3 tools/gen_assets.py

      - name: Check generated assets
        run: |
          echo "Generated assets:"
          find assets -maxdepth 1 -type f -print | sort

      - name: Build with PSPDEV
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/pspdev/pspdev:latest \
            make clean

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ghcr.io/pspdev/pspdev:latest \
            make

      - name: Show build output
        run: |
          ls -lh EBOOT.PBP

      - name: Upload PSP game
        uses: actions/upload-artifact@v4
        with:
          name: Ashfall-PSP
          path: |
            EBOOT.PBP
            assets/
          if-no-files-found: error
          retention-days: 30
